name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Release workflow dispatches CI for the Changesets release PR, since pushes
  # made with GITHUB_TOKEN don't trigger `pull_request` runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          node-version-file: package.json

      - run: vp run -r build
      - run: vp check
      - run: vp run -r test

      - uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1.80.0
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
