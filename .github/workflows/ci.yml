name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Release workflow dispatches CI for the Changesets release PR, since pushes
  # made with GITHUB_TOKEN don't trigger `pull_request` runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          node-version-file: package.json

      - run: vp run -r build
      - run: vp check
      - run: vp run -r test

      - uses: reviewdog/action-actionlint@5d802a8ebdcb24d712925118c3a4596f571d8fcd # v1.81.0
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
