name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          cache: true
          node-version-file: package.json

      - run: vp run -r build
      - run: vp check
      - run: vp run -r test

      - uses: reviewdog/action-actionlint@669cae8ed34fad00fe4f09dd85f34722204b0b9c # v1.75.3
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
