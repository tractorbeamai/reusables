name: Release

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          node-version-file: package.json
      - name: Expose pnpm for Changesets formatting
        run: corepack enable pnpm

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: "chore(release): version and publish packages"
          publish-script: vp exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushes made with GITHUB_TOKEN don't trigger `pull_request` workflows, so the
      # release PR would never get its required `Checks` run. GITHUB_TOKEN may
      # dispatch workflows, so run CI on the release branch explicitly.
      - name: Run CI on release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          branch="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          gh workflow run ci.yml --ref "$branch"
