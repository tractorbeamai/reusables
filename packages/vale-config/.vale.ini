StylesPath = styles
MinAlertLevel = suggestion

# Published styles, pinned by release. gitlab_base ships inside this package
# (see scripts/package.sh).
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-experimental.zip, \
  https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, \
  https://github.com/redhat-documentation/vale-at-red-hat/releases/download/v680/RedHat.zip

Vocab = Tractorbeam

# Front matter holds metadata (titles, owners' GitHub usernames), not prose.
IgnoredScopes = code, tt, text.frontmatter

[*.{md,mdx}]
BasedOnStyles = Vale, Google, ai-tells, ai-tells-experimental, gitlab_base, Tractorbeam

# Rules from Microsoft's and Red Hat's styles that no enabled style covers.
# Neither style is enabled as a whole: most of their rules repeat Google's.
Microsoft.Adverbs = YES
Microsoft.Militaristic = YES
Microsoft.Wordiness = YES
RedHat.Conjunctions = YES
RedHat.Definitions = YES
RedHat.ProductCentricWriting = YES

# Domain names, including in link text and email addresses, are lowercase by
# convention; without this, Vale.Terms reads tractorbeam.okta.com as
# misspellings of Tractorbeam and Okta. "Touch ID" is Apple's product name,
# which Google.WordListCase would otherwise change to "tap ID".
TokenIgnores = (?:[A-Za-z0-9-]+\.)+(?:ai|app|cloud|com|dev|io|net|org|run|sh|so|tech|tools|xyz)\b, \bTouch ID\b

# gitlab_base rules that check GitLab's own docs site, product terms, or
# formatting Oxfmt already handles.
gitlab_base.AlertFormat = NO
gitlab_base.CIConfigFile = NO
gitlab_base.CodeblockFences = NO
gitlab_base.DefaultBranch = NO
gitlab_base.EOLWhitespace = NO
gitlab_base.GitLabFlavoredMarkdown = NO
gitlab_base.Level = NO
gitlab_base.ListIndentation = NO
gitlab_base.Offerings = NO
gitlab_base.OutdatedVersions = NO
gitlab_base.Possessive = NO
gitlab_base.ReadingLevel = NO
gitlab_base.Spelling = NO
gitlab_base.Substitutions = NO
gitlab_base.TableDelimiterRows = NO
gitlab_base.ToDo = NO
gitlab_base.Uppercase = NO

# Rules that repeat another style's check.
gitlab_base.CurrentStatus = NO
# RedHat.Definitions makes the same check and exempts more well-known acronyms.
Google.Acronyms = NO
gitlab_base.FutureTense = NO
gitlab_base.LatinTerms = NO
gitlab_base.NonStandardHyphens = NO
gitlab_base.OxfordComma = NO
gitlab_base.Units = NO
ai-tells.SemicolonUsage = NO
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.PassiveVoice = NO
ai-tells-experimental.VocabularySwap = NO

# Tractorbeam.Dashes flags every em dash; it replaces ai-tells.EmDashUsage,
# which also flags en dashes in ranges, and Google.EmDash, which only flags
# the spaces around one.
ai-tells.EmDashUsage = NO
Google.EmDash = NO

# Forked as Tractorbeam.ParagraphLengthVariance and
# Tractorbeam.SentenceLengthVariance, which measure MDX container items
# separately.
ai-tells-experimental.ParagraphLengthVariance = NO
ai-tells-experimental.SentenceLengthVariance = NO

# Tractorbeam.Spelling checks spelling against GitLab's, Red Hat's, and
# Mintlify's word lists as well as the Tractorbeam vocabulary.
Vale.Spelling = NO

# House choices.
Google.Contractions = NO
Google.Headings = NO

# Noise on internal docs.
Google.Parens = NO

# Literal operations vocabulary that ai-tells reads as figurative.
ai-tells.BareHolds = NO
ai-tells.FigurativeFires = NO
ai-tells.FigurativeMints = NO
ai-tells.FigurativeOwns = NO
ai-tells.ShipOveruse = NO
