StylesPath = styles
MinAlertLevel = suggestion

# Published styles, pinned by release. gitlab_base and Mintlify ship inside
# this package (see scripts/package.sh).
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

Vocab = Tractorbeam

# Front matter holds metadata (titles, owners' GitHub usernames), not prose.
IgnoredScopes = code, tt, text.frontmatter

[*.{md,mdx}]
BasedOnStyles = Vale, Google, ai-tells, gitlab_base, Tractorbeam

# Mintlify's style is mostly Google's; take only the rule Google lacks.
Mintlify.CutPhrases = YES

# gitlab_base rules that check GitLab's own docs site, product terms, or
# formatting Oxfmt already handles.
gitlab_base.AlertFormat = NO
gitlab_base.CIConfigFile = NO
gitlab_base.CodeblockFences = NO
gitlab_base.DefaultBranch = NO
gitlab_base.EOLWhitespace = NO
gitlab_base.GitLabFlavoredMarkdown = NO
gitlab_base.Level = NO
gitlab_base.ListIndentation = NO
gitlab_base.Offerings = NO
gitlab_base.OutdatedVersions = NO
gitlab_base.Possessive = NO
gitlab_base.ReadingLevel = NO
gitlab_base.Spelling = NO
gitlab_base.Substitutions = NO
gitlab_base.TableDelimiterRows = NO
gitlab_base.ToDo = NO
gitlab_base.Uppercase = NO

# Rules that repeat another style's check.
gitlab_base.FutureTense = NO
gitlab_base.NonStandardHyphens = NO
gitlab_base.OxfordComma = NO
ai-tells.EmDashUsage = NO
ai-tells.SemicolonUsage = NO

# Tractorbeam.Spelling checks spelling against GitLab's, Red Hat's, and
# Mintlify's word lists as well as the Tractorbeam vocabulary.
Vale.Spelling = NO

# House choices.
Google.Contractions = NO
Google.EmDash = error

# Noise on internal docs.
Google.Acronyms = NO
Google.Parens = NO

# Literal operations vocabulary that ai-tells reads as figurative.
ai-tells.BareHolds = NO
ai-tells.FigurativeFires = NO
ai-tells.FigurativeMints = NO
ai-tells.FigurativeOwns = NO
ai-tells.ShipOveruse = NO
