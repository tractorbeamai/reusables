extends: existence
message: "AI punctuation: em-dash detected. Use a comma, period, or parentheses instead."
level: error
nonword: true
# ai-tells.EmDashUsage, with en dashes in ranges ("30–45 minutes",
# "CC1.1–CC1.5") left alone: an en dash between two numbers or codes is
# correct typography, not a dash.
tokens:
  - "—"
  - '(?<![\w.])–|–(?![\w])'
