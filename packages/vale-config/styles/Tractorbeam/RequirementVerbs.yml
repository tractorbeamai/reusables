extends: existence
message: "Replace '%s': use 'must' for required, 'should' for recommended, 'can' for optional, or 'might' for possibility."
# Policies keep 'shall' and 'may' as their guide defines; the package's
# .vale.ini turns this rule off under policies directories.
level: warning
ignorecase: true
tokens:
  - may
  - shall
