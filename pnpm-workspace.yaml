configDependencies:
  "@tractorbeam/pnpm-plugin-tractorbeam-defaults": latest
packages:
  - "packages/*"
  # Deprecated: frozen at their final published versions and no longer built.
  - "!packages/eslint-config"
  - "!packages/prettier-config"

catalogMode: strict

catalog:
  "@changesets/cli": 3.0.3
  "@tailwindcss/vite": 4.3.5
  "@vitejs/plugin-react": 6.3.0
  "@effect/tsgo": 0.70.0
  "@interfere/landmines": 0.1.1
  "@nkzw/oxlint-config": 3.0.1
  "@stylistic/eslint-plugin": 6.0.1
  "@oxlint/plugins": 1.94.0
  "@types/node": 26.6.6
  eslint-plugin-playwright: 2.12.2
  oxfmt: 0.79.0
  oxlint: 1.94.0
  # Type-aware rules run on tsrs; `effect-tsgo patch --oxlint` still requires
  # tsgolint installed.
  oxlint-tsgolint: 7.0.2007
  parse5: 8.1.1
  postcss: 8.5.33
  postcss-value-parser: 4.2.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.5
  tinyglobby: 0.2.17
  tsrs: 0.25.0-ts7.1.0-beta
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0
  vite-plugin-singlefile: 2.3.4
minimumReleaseAgeExclude:
  - "@tractorbeam/pnpm-plugin-tractorbeam-defaults"
  - "@nkzw/oxlint-config@3.0.1"
