# Pinned with its integrity, so the release-age gate does not hold it back.
configDependencies:
  "@tractorbeam/pnpm-config": 0.1.0+sha512-sEhkz+X3Oh1QNMdQhWFcXxKiftENPts0c5Q9mlTgWOsOaaqyWytMdLAD3G1JRXsZz9MSx0/W6D0bMXJohS9Zdw==
# Adds the Cloudflare packages to minimumReleaseAgeExclude.
pnpmfile:
  - node_modules/.pnpm-config/@tractorbeam/pnpm-config/pnpmfile.mjs
packages:
  - "packages/*"
  # Deprecated: frozen at their final published versions and no longer built.
  - "!packages/eslint-config"
  - "!packages/prettier-config"

catalogMode: strict

catalog:
  "@changesets/cli": 3.0.3
  "@effect/tsgo": 0.67.4
  "@stylistic/eslint-plugin": 5.10.0
  "@oxlint/plugins": 1.92.0
  "@types/node": 24.19.2
  eslint-plugin-playwright: 2.12.2
  oxfmt: 0.77.0
  oxlint: 1.92.0
  oxlint-plugin-effect: 0.32.1
  oxlint-plugin-anti-slop: github:dmmulroy/anti-slop#13909c9e07590f5a85d93c62712259fe14a883f7
  oxlint-tsgolint: 7.0.2006
  parse5: 8.1.0
  postcss: 8.5.32
  postcss-value-parser: 4.2.0
  tinyglobby: 0.2.17
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  vite-plugin-singlefile: 2.3.4
